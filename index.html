<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <!-- Links to your external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Profile Section -->
        <header class="profile">
            <!-- Replace with your own image URL -->
            <img class="profile-img" src="https://placeholder.com" alt="Profile Picture">
            <h1 class="profile-name">@yourusername</h1>
            <p class="profile-bio">Welcome to my page! Check out my latest content and projects below.</p>
        </header>

        <!-- Links Section -->
        <main class="links-container">
            <a href="https://yourwebsite.com" class="link-card" target="_blank" rel="noopener noreferrer">My Website</a>
            <a href="https://youtube.com" class="link-card" target="_blank" rel="noopener noreferrer">Latest YouTube Video</a>
            <a href="https://instagram.com" class="link-card" target="_blank" rel="noopener noreferrer">Instagram Portfolio</a>
            <a href="https://linkedin.com" class="link-card" target="_blank" rel="noopener noreferrer">Connect on LinkedIn</a>
        </main>
    </div>

</body>
</html>
