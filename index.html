<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyle Cop | Links</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="linktree-wrapper">
        <!-- Profile Section -->
        <header class="profile-header">
            <div class="avatar-circle">KC</div>
            <h1>Kyle Cop</h1>
            <p class="subtitle">3D Design & Engineering Portfolio</p>
        </header>

        <!-- Links Container -->
        <main class="links-container">
            
            <!-- Printables Custom Button -->
            <a href="https://printables.com" target="_blank" class="btn-link printables-btn">
                <span class="btn-icon">🖨️</span>
                <span class="btn-text">My Printables Portfolio</span>
            </a>

            <!-- GitHub Custom Button -->
            <a href="https://github.com" target="_blank" class="btn-link github-btn">
                <span class="btn-icon">🐙</span>
                <span class="btn-text">Follow on GitHub</span>
            </a>

        </main>
    </div>

</body>
</html>
